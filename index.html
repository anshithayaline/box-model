<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: gray;
            font-family: 'Courier New', Courier, monospace;
        }

        .fact-file{
            background-color: lightgreen;
            color: darkmagenta;
            width: 400px;
            padding: 20px;
            border: 5px solid royalblue;
            margin-top: 50px;
            margin-right: 45px;

        }

        .animal-name{
            color: darkblue;
            font-size: 20px;
            text-transform: capitalize;
        }

        .detail{
            color: darkred;
            text-transform: capitalize;
        }

        .other-name{
            font-weight: bold;
            text-transform: uppercase;
            color: darkorchid;
        }

        .name{
            font-size: 18px;
            text-transform: capitalize;
            color: black;
        }
    </style>
</head>
<body>
    <div class="fact-file">
       <h2 class="animal-name">Snow leopard</h2>
       <p class="detail">type: big cat</p>
       <h2 class="other-name">wild animal</h2>
       <p class="name">german dog</p>
       <p class="name">german shepard</p>
       <p class="bison"></p>

    </div>
</body>
</html>
